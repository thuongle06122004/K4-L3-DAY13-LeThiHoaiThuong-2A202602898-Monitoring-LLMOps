alerts:
  - name: high_chat_error_rate
    severity: critical
    condition: 'error_rate_pct > 2 over request_received events'
    duration: 5m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: llmops-oncall
    runbook: docs/alerts.md#high-chat-error-rate
  - name: slow_chat_p95
    severity: warning
    condition: 'p95(latency_ms) > 3000 ms for response_sent events'
    duration: 10m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: llmops-oncall
    runbook: docs/alerts.md#slow-chat-p95
  - name: retrieval_success_degraded
    severity: warning
    condition: 'tool_success_rate_pct < 90 for retrieval observations'
    duration: 10m
    type: symptom-based
    channel: '#llmops-alerts'
    owner: search-platform-oncall
    runbook: docs/alerts.md#retrieval-success-degraded
