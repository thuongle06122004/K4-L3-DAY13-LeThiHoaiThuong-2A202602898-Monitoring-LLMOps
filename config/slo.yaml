service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  error_budget_calculation: >-
    Error budget = 100% - 99.5% = 0.5% of request_received events in each 28-day
    window. For example, at 10,000 requests the service may have at most 50 slow or
    unsuccessful requests before the SLO is exhausted.
  rationale: >-
    The 3,000 ms threshold protects interactive chat responsiveness while allowing
    normal retrieval and generation latency. Re-evaluate the threshold after collecting
    a representative production baseline.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
